services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
    privileged: true
    devices:
      - "/dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_30cb6cf697c2ef118c7ec9138148b910-if00-port0:/dev/ttyUSB0"
      - /dev/ttyACM0:/dev/ttyACM0

  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./music_assistant:/data
    #si pb, voir ici pour se réauthentifier : http://192.168.1.43:8095/#/settings/providers


  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    hostname: servergarage
    privileged: true
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-routes=192.168.1.0/24 --advertise-exit-node 
      - TS_USERSPACE=false
    network_mode: "host"
    restart: unless-stopped
    #docker compose up -d tailscale
    #docker exec -it tailscale tailscale up --advertise-routes=192.168.1.0/24 --advertise-exit-node --accept-dns=false
    #Il te donne un lien https://login.tailscale.com/a/XXXX

  transmission:
    image: lscr.io/linuxserver/transmission
    container_name: transmission
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /mnt/downloads/transmission:/downloads
      - ./config/transmission:/config
    restart: unless-stopped

  soulseek:
    image: realies/soulseek
    container_name: soulseek
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - /mnt/downloads/soulseek:/data
    environment:
      - PUID=1000
      - PGID=1000
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env.vpn
    ports:
      - "9091:9091"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - SERVER_COUNTRIES=Netherlands,Switzerland
      - DNS_ADDRESS=1.1.1.1
      - DOT=off
      - PORT_FORWARD_ONLY=on
      - OPENVPN_PROTOCOL=udp
    networks:
      - vpn_net
    restart: unless-stopped

networks:
  vpn_net:
    name: vpn_net
